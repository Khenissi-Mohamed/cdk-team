    <!--

    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="CDK Team Sevran – Club de jiu-jitsu brésilien" />

      content="Découvrez CDK Team à Sevran : jiu-jitsu brésilien, gi et no-gi, adultes et enfants. Consultez les horaires, tarifs et modalités d'inscription."
    />
    <meta property="og:url" content="https://team-cdk.fr/" />
    <meta property="og:image" content="https://team-cdk.fr/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Identité du club, disponible sans exécuter JavaScript. -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "SportsClub",
        "@id": "https://team-cdk.fr/#club",
