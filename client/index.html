<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0b" />

    <title>CDK-Team — Jiu-jitsu brésilien</title>
    <meta
      name="description"
      content="Club de jiu-jitsu brésilien : gi, no-gi, cours enfants et compétition. Planning de la semaine, tarifs et dossier d'inscription. Deux cours d'essai offerts."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Open Graph. `og:url` et `og:image` doivent être en URL ABSOLUE : les
      réseaux sociaux récupèrent la page depuis leurs propres serveurs et ne
      résolvent pas les chemins relatifs.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CDK-Team" />
    <meta property="og:title" content="CDK-Team — Jiu-jitsu brésilien" />
    <meta
      property="og:description"
      content="Gi, no-gi, kids et compétition. Deux cours d'essai offerts, kimono prêté."
    />
    <meta property="og:url" content="https://DOMAINE_A_DEFINIR/" />
    <meta property="og:image" content="https://DOMAINE_A_DEFINIR/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Données structurées. Sur une application monopage sans rendu serveur,
      c'est le principal levier de référencement local disponible : le robot
      lit ce bloc sans avoir à exécuter l'application.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsClub",
        "name": "CDK-Team",
        "sport": "Jiu-jitsu brésilien",
        "description": "Club de jiu-jitsu brésilien : gi, no-gi, enfants et compétition."
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
